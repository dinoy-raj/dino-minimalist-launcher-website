<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- SEO -->
    <title>Dino Minimalist Launcher – Minimal Android Home Screen</title>
    <meta name="description" content="Dino is a free, ad-free minimalist launcher for Android. A calm, text-only minimal home screen with focus tools, app blocker and 12+ themes to cut screen time.">
    <meta name="author" content="Dinoy Raj">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="theme-color" content="#ffffff">
    <link rel="canonical" href="https://minimalistlauncher.com/">

    <!-- Open Graph -->
    <meta property="og:site_name" content="Dino Minimalist Launcher">
    <meta property="og:title" content="Dino Minimalist Launcher – Minimal Android Home Screen">
    <meta property="og:description" content="A free, ad-free minimalist launcher for Android. A calm, text-only home screen that cuts distractions and screen time.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://minimalistlauncher.com/">
    <meta property="og:locale" content="en_US">
    <meta property="og:image" content="https://minimalistlauncher.com/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Dino Minimalist Launcher: a text-only Android home screen">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dino Minimalist Launcher – Minimal Android Home Screen">
    <meta name="twitter:description" content="A free, ad-free minimalist launcher for Android. A calm, text-only home screen that cuts distractions and screen time.">
    <meta name="twitter:image" content="https://minimalistlauncher.com/og-image.png">

    <!-- Fonts: Inter for the page, the rest for the phone's theme previews -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&family=Doto:wght@700&display=swap">

    <!-- Structured data (the FAQ's lives next to it in the page body) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://minimalistlauncher.com/#website",
          "name": "Dino Minimalist Launcher",
          "alternateName": ["Dino Launcher", "Simple Launcher"],
          "url": "https://minimalistlauncher.com/"
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://minimalistlauncher.com/#app",
          "name": "Dino Minimalist Launcher",
          "alternateName": ["Dino Launcher", "Simple Launcher: Minimalist"],
          "description": "A free, ad-free minimalist launcher for Android: a calm, text-only minimal home screen with focus tools, an app blocker, themes and fonts to reduce screen time.",
          "url": "https://minimalistlauncher.com/",
          "image": "https://minimalistlauncher.com/og-image.png",
          "applicationCategory": "LifestyleApplication",
          "applicationSubCategory": "Launcher",
          "operatingSystem": "Android 8.0 or later",
          "installUrl": "https://play.google.com/store/apps/details?id=com.dino.simple",
          "downloadUrl": "https://play.google.com/store/apps/details?id=com.dino.simple",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
          "aggregateRating": { "@type": "AggregateRating", "ratingValue": "4.8", "ratingCount": "2500", "bestRating": "5" },
          "author": { "@type": "Person", "name": "Dinoy Raj", "url": "https://linktr.ee/dinoyraj" }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
